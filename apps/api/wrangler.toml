name = "attach"
main = "src/index.ts"
compatibility_date = "2026-08-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Bind the public hostname to this Worker after the script exists.

[assets]
directory = "../web/dist"
# API and object routes must hit the Worker; `/` and static files are assets-only.
run_worker_first = ["/v1/*", "/o/*", "/p/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "attach"
jurisdiction = "eu"

[[d1_databases]]
binding = "DB"
database_name = "attach"
# Patched at deploy from CLOUDFLARE_D1_DATABASE_ID (see apps/api/scripts/deploy.ts).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "JTI"
class_name = "JtiStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JtiStore"]

# Safe plain-text defaults are overridden by deploy.ts:
#   ALLOWED_GITHUB_USER_IDS, ATTACH_PUBLIC_BASE
# Secrets (not vars — CF forbids the same binding in both):
#   GITHUB_APP_CLIENT_ID / GITHUB_APP_CLIENT_SECRET
#   AGENT_REGISTRY — JSON agent allowlist + public keys (see docs/deploy.md)

[secrets]
required = ["GITHUB_APP_CLIENT_ID", "GITHUB_APP_CLIENT_SECRET"]

[vars]
ALLOWED_GITHUB_USER_IDS = ""
ATTACH_PUBLIC_BASE = "https://attach.uinaf.dev"

[observability]
enabled = true
