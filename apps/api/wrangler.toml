name = "attach"
main = "src/index.ts"
compatibility_date = "2026-08-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Custom domain attach.uinaf.dev is bound in uinaf/infra
# (cloudflare_workers_custom_domain) after the Worker exists.

[assets]
directory = "../web/dist"
# API and object routes must hit the Worker; `/` and static files are assets-only.
run_worker_first = ["/v1/*", "/o/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "attach"
jurisdiction = "eu"

[[d1_databases]]
binding = "DB"
database_name = "attach"
database_id = "12791514-1a8e-4aa2-9e2a-25707ac93d8d"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "JTI"
class_name = "JtiStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JtiStore"]

[vars]
ALLOWED_GITHUB_USER_IDS = "9790196"
ATTACH_PUBLIC_BASE = "https://attach.uinaf.dev"
# Empty until Glitch pubkey is installed via `wrangler secret put AGENT_REGISTRY`.
AGENT_REGISTRY = "[]"
# GITHUB_APP_CLIENT_ID / GITHUB_APP_CLIENT_SECRET via `wrangler secret` after App create.
# AGENT_REGISTRY secret overrides this var when set. Example:
# [{"app_id":"4455325","slug":"glitch418x","public_keys":[{"pem":"-----BEGIN PUBLIC KEY-----\n...\n-----END PUBLIC KEY-----"}]}]

[observability]
enabled = true
