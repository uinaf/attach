<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>not found · attach</title>
    <link rel="icon" href="https://cdn.uinaf.dev/images/uinaf-computer.png" type="image/png" />
    <link rel="stylesheet" href="https://cdn.uinaf.dev/fonts/berkeley-mono/variable/font.css" />
    <link rel="stylesheet" href="https://design.uinaf.dev/tokens.css" />
    <style>
      body {
        margin: 0;
      }
      /* templates/not-found.html: centered frame, 24px gutter, 14vh of bottom
         weight so the mark sits above the optical middle. */
      .frame {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--sp-6) var(--sp-6) 14vh;
        box-sizing: border-box;
      }
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--sp-6);
        text-align: center;
        animation: ue 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .stack img {
        border: 1px solid var(--neutral-900);
        display: block;
      }
      @keyframes ue {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .stack {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="uinaf">
    <div class="frame">
      <div class="stack">
        <img
          src="https://cdn.uinaf.dev/images/uinaf-computer.png"
          width="120"
          height="120"
          alt=""
        />
        <span class="u-label">404</span>
        <h1>this page doesn't exist.<br />maybe it never did.</h1>
        <a class="u-btn" href="/">back home</a>
      </div>
    </div>
  </body>
</html>
