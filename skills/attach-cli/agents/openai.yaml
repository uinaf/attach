interface:
  display_name: "attach-cli"
  short_description: "Upload PR/validation media via attach, gh attach, or App JWT enroll"
  default_prompt: |
    Use $attach-cli.

    Goal: upload PR or validation media to the attach Worker and return a
    public preview URL (or raw/markdown when asked).

    Require the installed `attach` CLI or `gh attach` extension. For hosted
    human use: attach login → attach put, with no client-id setup. Custom
    deployments override ATTACH_API_BASE and ATTACH_GITHUB_CLIENT_ID. For
    GitHub App agents: JWT enroll then att_ upload (see skill references).
    During human device-flow login, immediately relay the verification URL and
    short-lived device code to the intended user, then wait for authorization;
    never copy the code into durable or public artifacts.
    Never send GitHub tokens to put; never invent a second upload client.

    Output: the resulting URL or a precise blocker (install, client id,
    allowlist, registry, auth).
