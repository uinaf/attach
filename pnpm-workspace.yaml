packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
overrides:
  vite: "catalog:"
  # vitest-pool-workers pins wrangler@4.56.0 (deprecated deploy-delegation bug).
  wrangler: "^4.120.0"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Git-hosted packages need repository-form allowBuilds (name alone is registry-only).
# design ships dist/; prepare is `vp config --no-agent` and is safe to run.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  "@uinaf/design@git+https://github.com/uinaf/design.git": true

minimumReleaseAgeExclude:
  - "@uinaf/design@0.1.0"
