packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# design ships dist in git; skip its prepare (vp config). Allow worker toolchain builds.
neverBuiltDependencies:
  - "@uinaf/design"
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp
allowBuilds:
  esbuild: true
  workerd: true
