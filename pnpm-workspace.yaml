packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@cloudflare/vitest-pool-workers": ^0.20.3
  "@cloudflare/workers-types": ^5.20260801.1
  "@types/node": ^24
  "@uinaf/design": ^1.13.5
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
  vitest: ~4.1.10
overrides:
  vite: "catalog:"
  # vitest-pool-workers pins wrangler@4.56.0 (deprecated deploy-delegation bug).
  wrangler: "^4.120.0"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true

minimumReleaseAgeExclude:
  - "@uinaf/design@1.13.5"
