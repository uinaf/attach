rules:
  unpinned-uses:
    config:
      policies:
        # First-party reusable workflows track main by design; version and
        # digest bumps land once in uinaf/.github for every adopter.
        "uinaf/.github/*": ref-pin
        "*": hash-pin
  impostor-commit:
    ignore:
      # publish-skill.yml pins the private first-party uinaf/tessl-publish-action;
      # the audit cannot list tags on a repo this token cannot read.
      - publish-skill.yml
