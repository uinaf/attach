name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Restore Vite Task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm exec vp run ready

  scan:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: uinaf/.github/.github/workflows/scan.yml@main

  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: [verify, scan]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    environment:
      name: production
      url: https://attach.uinaf.dev
    concurrency:
      group: deploy-${{ github.repository }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: ".node-version"
          cache: false
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          ALLOWED_GITHUB_USER_IDS: ${{ vars.ALLOWED_GITHUB_USER_IDS }}
          ATTACH_PUBLIC_BASE: ${{ vars.ATTACH_PUBLIC_BASE }}
        run: |
          pnpm exec vp run -t @uinaf/attach-web#build
          node apps/api/scripts/deploy.ts
