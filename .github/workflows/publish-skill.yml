name: Publish skill

on:
  push:
    branches:
      - main
    paths:
      - "skills/attach-cli/**"
      - "scripts/verify-published-skill.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish skill
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: skill-release
      deployment: false
    concurrency:
      group: publish-skill-${{ github.repository }}-main
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Tessl
        uses: tesslio/setup-tessl@33e1c9253e3673f28e1b8949475b250dbd57918e
        with:
          version: "0.94.0"
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Publish manifest version
        id: publish
        run: |
          tessl plugin lint skills/attach-cli
          tessl plugin publish skills/attach-cli
          jq -r '"version=" + .version' \
            skills/attach-cli/.tessl-plugin/plugin.json >> "$GITHUB_OUTPUT"

      - name: Smoke published skill
        env:
          PUBLISHED_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          ./scripts/verify-published-skill.sh "$PUBLISHED_VERSION"
